const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let filter = "all";
try { filter = localStorage.getItem("cheat-filter") || "all"; } catch (e) {}

function renderLine(line) {
  if (line.trim().startsWith("#")) return `<span class="c">${esc(line)}</span>`;
  const i = line.indexOf("   #");
  const body = i >= 0 ? esc(line.slice(0, i)) + `<span class="c">${esc(line.slice(i))}</span>` : esc(line);
  return `<span class="p">$ </span>${body}`;
}
function copyText(lines) {
  return lines.filter((l) => !l.trim().startsWith("#")).map((l) => { const i = l.indexOf("   #"); return (i >= 0 ? l.slice(0, i) : l).trimEnd(); }).join("\n");
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  let total = 0, html = "", toc = "";
  DATA.forEach((cat, ci) => {
    if (filter !== "all" && cat.kind !== filter) return;
    const items = cat.items.map((it, ii) => ({ it, ii })).filter(({ it }) => !q ||
      [it.cmd, it.desc, it.note || "", cat.title, ...it.ex].join(" ").toLowerCase().includes(q));
    if (!items.length) return;
    total += items.length;
    toc += `<a href="#${cat.id}"><span class="dot ${cat.kind}"></span>${esc(cat.title)}</a>`;
    html += `<section class="cat" id="${cat.id}"><h2><span class="kind ${cat.kind}">${cat.kind}</span>${esc(cat.title)}</h2><p>${esc(cat.lead)}</p><div class="grid">` +
      items.map(({ it, ii }) => `<article class="card${it.danger ? " danger" : ""}">
        <div class="head"><code class="cmd">${esc(it.cmd)}</code>${it.danger ? '<span class="badge">⚠ 주의</span>' : ""}</div>
        <p class="desc">${esc(it.desc)}</p>
        <div class="ex"><pre>${it.ex.map(renderLine).join("\n")}</pre><button type="button" class="copy" data-k="${ci}-${ii}">복사</button></div>
        ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
      </article>`).join("") + `</div></section>`;
  });
  $("#main").innerHTML = html || `<p class="empty">“${esc(q)}”에 맞는 명령어가 없습니다. 다른 단어로 검색해 보세요.</p>`;
  $("#toc").innerHTML = toc;
  $("#count").textContent = `${total}개 명령`;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
}

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.f;
  try { localStorage.setItem("cheat-filter", filter); } catch (e) {}
  render();
}));
$("#q").addEventListener("input", render);

$("#main").addEventListener("click", (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const [ci, ii] = btn.dataset.k.split("-").map(Number);
  const text = copyText(DATA[ci].items[ii].ex);
  const done = (msg) => { btn.textContent = msg; setTimeout(() => (btn.textContent = "복사"), 1400); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Ctrl+C");
  };
  try {
    navigator.clipboard.writeText(text).then(() => done("복사됨"), fallback);
  } catch (err) { fallback(); }
});

render();
</script>
